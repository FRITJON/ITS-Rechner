<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klinische Rechner-Tools · Anästhesie</title>
<style>
  :root {
    --ink: #16232d;
    --paper: #f7f8f7;
    --card: #ffffff;
    --line: #d9dfe1;
    --liver: #b5772f;    /* SOFA-Tile Akzent */
    --renal: #2b6ca3;    /* TIVA-Tile Akzent */
    --cardio: #a5333f;
    --muted: #5a6b73;
    --focus: #1c5b8a;
    --mix-base: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8edf0;
      --paper: #12181c;
      --card: #1b232a;
      --line: #35414a;
      --liver: #d99a52;
      --renal: #6fa8d8;
      --cardio: #e0707c;
      --muted: #93a3ac;
      --focus: #7bb4e6;
      --mix-base: #1b232a;
    }
  }

  * { box-sizing: border-box; }

  html { color-scheme: light dark; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
    padding: 1.25rem;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  header.page {
    margin-bottom: 1.5rem;
  }

  header.page .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  header.page h1 {
    font-size: 1.6rem;
    margin: 0.15rem 0 0;
    font-weight: 700;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.1rem;
  }

  .tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--accent, var(--ink));
    border-radius: 10px;
    padding: 1.1rem 1.25rem 1.25rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .tile:not(.disabled):hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }

  .tile:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .tile.sofa   { --accent: var(--liver); }
  .tile.tiva   { --accent: var(--renal); }
  .tile.osmo   { --accent: var(--cardio); }

  .tile h2 {
    font-size: 1.25rem;
    margin: 0;
    font-weight: 700;
    color: var(--accent);
  }

  .tile p.desc {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0;
  }

  .tile.disabled {
    opacity: 0.6;
    cursor: default;
  }

  .pending-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, var(--mix-base));
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    margin-left: 0.4rem;
    vertical-align: middle;
  }

  @media (max-width: 420px) {
    header.page h1 { font-size: 1.35rem; }

    .tiles { grid-template-columns: 1fr; gap: 0.6rem; }

    .tile {
      padding: 0.7rem 0.9rem;
      gap: 0.2rem;
      border-left-width: 4px;
    }

    .tile h2 { font-size: 1.05rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div class="eyebrow">EvK Witten · Anästhesie</div>
    <h1>Klinische Rechner-Tools</h1>
  </header>

  <div class="tiles">

    <a class="tile sofa" href="sofa-score-tools.html">
      <h2>SOFA-Score</h2>
      <p class="desc">Umrechnungen Bilirubin, Kreatinin und Katecholamine für die SOFA-Score-Erhebung.</p>
    </a>

    <a class="tile tiva" href="tiva-rechner.html">
      <h2>TIVA-Rechner</h2>
      <p class="desc">Rechner für die totale intravenöse Anästhesie.</p>
    </a>

    <div class="tile osmo disabled">
      <h2>Osmolalität <span class="pending-badge">In Arbeit</span></h2>
      <p class="desc">Berechnung der Serum-Osmolalität.</p>
    </div>

  </div>

</div>

<script>
  // Kacheln automatisch sortieren: zuerst aktive, dann deaktivierte Kacheln,
  // innerhalb jeder Gruppe alphabetisch nach Überschrift (unabhängig von der Reihenfolge im HTML)
  (function sortTiles() {
    const container = document.querySelector('.tiles');
    const tiles = Array.from(container.querySelectorAll('.tile'));
    tiles.sort((a, b) => {
      const disabledA = a.classList.contains('disabled') ? 1 : 0;
      const disabledB = b.classList.contains('disabled') ? 1 : 0;
      if (disabledA !== disabledB) return disabledA - disabledB;
      const textA = a.querySelector('h2').childNodes[0].textContent.trim();
      const textB = b.querySelector('h2').childNodes[0].textContent.trim();
      return textA.localeCompare(textB, 'de');
    });
    tiles.forEach(tile => container.appendChild(tile));
  })();
</script>

</body>
</html>
